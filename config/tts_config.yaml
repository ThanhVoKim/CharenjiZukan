# Cấu hình mặc định cho TTS CLI
# Sử dụng: uv run tts --config config/tts_config.yaml --input file.srt

# Provider mặc định: edge | voicevox_nemo | voicevox | qwen
provider: "edge"

# ── EdgeTTS ──────────────────────────────────────────────────────────
edge:
  voice: "ja-JP-KeitaNeural"
  rate: "+0%"
  volume: "+0%"
  pitch: "+0Hz"
  concurrent: 10
  strip_silence: true
  silence_thresh_dbfs: -50
  speed_scale: 1.0 # >1.0 = tăng tốc audio sau synth (giữ pitch) → video đỡ kéo chậm

# ── Voicevox Nemo ────────────────────────────────────────────────────
voicevox_nemo:
  voice_id: 10008
  host: "127.0.0.1"
  port: 50121
  speed_scale: 1.1
  pitch_scale: 0
  intonation_scale: 1
  volume_scale: 1.75
  output_sampling_rate: 48000
  concurrent_requests: 100
  max_retries: 3

# ── Voicevox (chính thức) ────────────────────────────────────────────
voicevox:
  voice_id: 100
  host: "127.0.0.1"
  port: 50021
  speed_scale: 1.1
  pitch_scale: 0
  intonation_scale: 1
  volume_scale: 1.75
  output_sampling_rate: 48000
  concurrent_requests: 100
  max_retries: 3

# ── Qwen3-TTS ────────────────────────────────────────────────────────
qwen:
  model_path: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
  ref_audio: "/content/assets/Minimax - English_Magnetic_Male_12.mp3"
  ref_text: "Hello. I'm delighted to assist you with our voice services. Choose a voice that resonates with you, and let's begin our creative audio journey together."
  batch_size: 32
  device: "cuda:0"
  dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  pre_phoneme_length: 0.1 # silence (giây) thêm vào đầu mỗi clip (sau trim)
  post_phoneme_length: 0.1 # silence (giây) thêm vào cuối mỗi clip (sau trim)

  # ── Xử lý đuôi clip (Design A: trim + fade + pad) ──────────────────
  # Diệt rè/bíp/bộp cuối clip + đồng nhất silence cuối (token codec OOD).
  # Luồng: (1) trim silence/garbage 2 đầu → (2) fade-out/in N ms mép speech
  #        → (3) pad silence cố định = pre/post_phoneme_length.
  clean_tail: true # tắt (false) nếu muốn giữ hành vi pad thuần cũ
  fade_ms: 8.0 # ms fade ở mép speech trước khi nối silence; tăng nếu vẫn còn click
  trim_top_db: 30.0 # ngưỡng trim (dB dưới đỉnh); giảm (vd 25) nếu đuôi âm bị xén
  speed_scale: 1.0 # >1.0 = tăng tốc audio sau synth (giữ pitch) → video đỡ kéo chậm

# ── Qwen3-TTS Custom Voice (checkpoint fine-tune, generate_custom_voice) ──
# Dùng checkpoint đã full-SFT thành 1 giọng cố định (vd Karlsson DE). Engine tự copy
# checkpoint Drive→local rồi load từ local (Drive FUSE chậm + dễ lỗi I/O với file ~3.5GB).
qwen_custom:
  drive_ckpt: "/content/drive/MyDrive/qwen3tts_karlsson_de/export/qwen3tts-karlsson-de"
  local_ckpt: "/content/qwen3tts-karlsson-de" # engine copy Drive→local rồi load từ đây
  speaker: "karlsson_de"
  language: "German"
  batch_size: 32
  device: "cuda:0"
  dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  pre_phoneme_length: 0.1
  post_phoneme_length: 0.1
  # ── Xử lý đuôi clip (Design A: trim + fade + pad) — như provider qwen ──
  clean_tail: true
  fade_ms: 8.0
  trim_top_db: 30.0
  speed_scale: 1 # >1.0 = tăng tốc audio sau synth (giữ pitch) → video đỡ kéo chậm
