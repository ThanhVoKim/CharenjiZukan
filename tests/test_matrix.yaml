  # ──────────────────────────────────────────────
  # Tags có sẵn:
  #   unit                 → Không cần GPU/FFmpeg/API thật, chạy nhanh
  #   integration          → Cần file thật, subprocess, hoặc component mock
  #   ffmpeg               → Cần FFmpeg trong PATH
